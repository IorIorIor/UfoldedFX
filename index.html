<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UfoldedFX — Aura Heart</title>
<style>
  :root {
    --panel-bg: rgba(16, 10, 26, 0.88);
    --panel-border: rgba(255, 255, 255, 0.08);
    --accent: #ff4d6d;
    --text: #e8e2f2;
    --text-dim: #9a8fb0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #14081f; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  #glcanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* everything lives in one unstyled right-side column, floating directly
     over the shader with a text-shadow for legibility — no panel box */
  #quickPanel {
    position: fixed; top: 16px; right: 12px; bottom: 12px; z-index: 5;
    width: 230px; color: var(--text);
    display: flex; flex-direction: column;
  }
  #quickPanel.hidden { display: none; }
  #quickPanel .ctl label, #quickPanel .ctl .val,
  #quickPanel summary, #quickPanel .sub {
    text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.7);
  }

  #moreSettings {
    display: none; margin-top: 10px; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: thin; padding-right: 2px; flex: 1 1 auto; min-height: 0;
  }
  #moreSettings.open { display: block; }

  details { margin-bottom: 10px; }
  details summary { cursor: pointer; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); padding: 4px 0; user-select: none; }
  details summary:hover { color: var(--accent); }

  .ctl { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 6px; margin: 7px 0; }
  .ctl label { font-size: 10px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl .val { font-size: 10px; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 18px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; background: rgba(255,255,255,0.18); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-top: -4.5px; border: none; }
  input[type=range]::-moz-range-track { height: 3px; background: rgba(255,255,255,0.18); border-radius: 2px; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; }
  input[type=color] { width: 100%; height: 22px; border: none; background: none; padding: 0; cursor: pointer; }
  input.hex {
    font-family: inherit; font-size: 10px; color: var(--text); letter-spacing: 1px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--panel-border);
    border-radius: 4px; padding: 4px 6px; width: 100%; text-transform: lowercase;
  }
  input.hex:focus { outline: none; border-color: var(--accent); }

  #statesIO {
    display: none; width: 100%; height: 110px; margin: 6px 0; resize: vertical;
    font: 10px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--text);
    background: rgba(0,0,0,0.45); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 6px;
  }
  #statesIO.open { display: block; }
  #statesIO:focus { outline: none; border-color: var(--accent); }

  #savedList { display: none; margin: 0 0 10px; }
  #savedList.open { display: block; }
  .savedRow {
    display: flex; align-items: center; gap: 6px; padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .savedRow:last-child { border-bottom: none; }
  .savedRow .name {
    flex: 1; font-size: 11px; color: var(--text); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.7);
  }
  .savedRow .name:hover { color: var(--accent); }
  .savedRow input.renameInput {
    flex: 1; font-size: 11px; color: var(--text); background: rgba(255,255,255,0.06);
    border: 1px solid var(--accent); border-radius: 4px; padding: 3px 6px; min-width: 0;
  }
  .savedRow button { flex: none; width: auto; padding: 3px 8px; font-size: 10px; }
  #savedList .empty { padding: 6px 0; font-size: 10px; color: var(--text-dim); text-shadow: 0 1px 4px rgba(0,0,0,0.9); }

  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  button {
    flex: 1 1 auto; font-family: inherit; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    background: rgba(255,255,255,0.07); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 6px; padding: 7px 8px; cursor: pointer;
  }
  button:hover { background: rgba(255, 77, 109, 0.25); border-color: var(--accent); }

  #toggleUI {
    display: block; width: 100%; margin-top: 10px; flex: none;
    background: var(--panel-bg); backdrop-filter: blur(8px);
  }
  #toggleUI.on { background: rgba(255, 77, 109, 0.35); border-color: var(--accent); }
  #err { position: fixed; left: 12px; bottom: 12px; color: #ff8080; font-size: 11px; white-space: pre-wrap; max-width: 60vw; }

  @media (max-width: 640px) {
    #quickPanel { width: min(70vw, 260px); }
    input[type=range] { height: 28px; }
    input[type=range]::-webkit-slider-thumb { width: 16px; height: 16px; margin-top: -6.5px; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; }
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="quickPanel" class="hidden">
  <div id="quickBar"></div>
  <button id="toggleUI" title="Show more controls">All Settings</button>
  <div id="moreSettings">
    <div class="btnrow">
      <button id="pause">Pause</button>
      <button id="savepng">Save PNG</button>
    </div>
    <div class="btnrow">
      <button id="saveSettings">Save State</button>
      <button id="toggleSaved">States (0) ▾</button>
    </div>
    <div class="btnrow">
      <button id="exportStates">Export</button>
      <button id="importStates">Import</button>
    </div>
    <textarea id="statesIO" spellcheck="false"></textarea>
    <div id="savedList"></div>
    <div id="groups"></div>
  </div>
</div>
<div id="err"></div>

const VERT = `
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
`;

const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  u_res;
uniform float u_time;

uniform float u_scale, u_posX, u_posY, u_stretchX, u_stretchY, u_rot, u_round;
uniform float u_spread, u_bandOff, u_spaceExp, u_soft, u_glowStr, u_glowFall;
uniform float u_pulseAmt, u_pulseShape, u_beatSharp;
// phases are integrated on the CPU (phase += speed * dt) so that animating
// a speed slider changes the rate of motion, never the current phase —
// computing fract(time * speed) here would jump wildly while speed tweens
uniform float u_pulsePhase, u_spinPhase, u_huePhase, u_driftPhase;
uniform float u_sliceMix, u_sliceOffX, u_sliceOffY, u_sliceZoom, u_sliceSpaceFrac;
uniform float u_sliceSeed, u_stripShade, u_shadeWidth, u_drift;
uniform float u_sliceSkew, u_slicePersp, u_sliceRandom;
uniform float u_chromAb, u_grain, u_vig, u_bright, u_contrast, u_sat;
uniform float u_shapeMix, u_nestMix;
uniform sampler2D u_sdf;
uniform sampler2D u_rad;
uniform vec3  u_colGlow;
uniform sampler2D u_grad;
uniform float u_glowU0, u_glowU1;

float dot2(vec2 v){ return dot(v, v); }
// sin-free hashes (Dave Hoskins) — stable on mediump mobile GPUs
float hash(float n){
  n = fract(n * 0.1031);
  n *= n + 33.33;
  n *= n + n;
  return fract(n);
}
float hash2(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

// exact heart SDF (Inigo Quilez) — tip at origin, lobes toward y = 1
float sdHeart(vec2 p){
  p.x = abs(p.x);
  if (p.y + p.x > 1.0)
    return sqrt(dot2(p - vec2(0.25, 0.75))) - 0.35355339;
  return sqrt(min(dot2(p - vec2(0.0, 1.0)),
                  dot2(p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);
}

// SDF baked from the SVG heart outline into a 16-bit texture over
// domain x,y in [-2,2]x[-1.5,2.5]; decode kept mediump-safe
const float SDF_TS = 192.0;
float sdfDecode(vec4 t){
  return (t.r * 256.0 + t.g) / 257.0 * 3.5 - 0.75;
}
float sdSvg(vec2 p){
  vec2 uv = (p - vec2(-2.0, -1.5)) / 4.0;
  vec2 f = clamp(uv * SDF_TS - 0.5, 0.0, SDF_TS - 1.001);
  vec2 b = floor(f);
  vec2 fr = f - b;
  vec2 t0 = (b + 0.5) / SDF_TS;
  float px = 1.0 / SDF_TS;
  float d00 = sdfDecode(texture2D(u_sdf, t0));
  float d10 = sdfDecode(texture2D(u_sdf, t0 + vec2(px, 0.0)));
  float d01 = sdfDecode(texture2D(u_sdf, t0 + vec2(0.0, px)));
  float d11 = sdfDecode(texture2D(u_sdf, t0 + vec2(px, px)));
  return mix(mix(d00, d10, fr.x), mix(d01, d11, fr.x), fr.y);
}

// polar radius of the heart about its centre, from a 512x1 lookup table
float radiusAt(float ang){
  float x = (ang + 3.14159265) / 6.2831853 * 512.0 - 0.5;
  float b = floor(x);
  float fr = x - b;
  float u0 = (mod(b, 512.0) + 0.5) / 512.0;
  float u1 = (mod(b + 1.0, 512.0) + 0.5) / 512.0;
  vec4 t0 = texture2D(u_rad, vec2(u0, 0.5));
  vec4 t1 = texture2D(u_rad, vec2(u1, 0.5));
  float r0 = (t0.r * 256.0 + t0.g) / 257.0;
  float r1 = (t1.r * 256.0 + t1.g) / 257.0;
  return mix(r0, r1, fr) * 1.5;
}

// nested field: iso-contours are scaled copies of the heart, so every ring
// keeps the notch and the tip (this is how the reference wallpaper nests)
float sdNested(vec2 p){
  vec2 v = p - vec2(0.0, 0.5);
  float len = length(v);
  if (len < 1e-4) return -0.55;
  float R = radiusAt(atan(v.y, v.x));
  return (len / max(R, 1e-3) - 1.0) * 0.55;
}

float heartSDF(vec2 p){
  float dOff;
  if      (u_shapeMix > 0.999) dOff = sdHeart(p);
  else if (u_shapeMix < 0.001) dOff = sdSvg(p);
  else                         dOff = mix(sdSvg(p), sdHeart(p), u_shapeMix);
  if (u_nestMix > 0.999) return dOff;
  // nested rings near the heart, easing into offset rings with distance, so
  // inner rings keep a deep notch and the halo smooths out (as in the
  // reference wallpaper); u_nestMix pushes the whole field toward offset
  float dN = sdNested(p);
  float w = mix(smoothstep(0.05, 0.65, dN), 1.0, u_nestMix);
  return mix(dN, dOff, w);
}

float gauss(float x, float c, float w){
  float d = (x - c) * w;
  return exp(-d * d);
}

// heartbeat curve: sine blended toward a double-thump
float pulse(){
  float t = fract(u_pulsePhase);
  float sine = 0.5 + 0.5 * sin(6.2831853 * t);
  float beat = gauss(t, 0.12, u_beatSharp) + 0.55 * gauss(t, 0.34, u_beatSharp * 1.1);
  return mix(sine, min(beat, 1.0), u_pulseShape);
}


vec3 hueRotate(vec3 c, float a){
  const vec3 k = vec3(0.57735026);
  float ca = cos(a), sa = sin(a);
  return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca);
}

// nested-heart gradient at aspect-corrected screen point uv
vec3 heartColor(vec2 uv){
  vec2 p = uv - vec2(u_posX, u_posY);
  float ang = radians(u_rot) + u_spinPhase;
  float ca = cos(ang), sa = sin(ang);
  p = vec2(ca * p.x - sa * p.y, sa * p.x + ca * p.y);

  float sc = u_scale * (1.0 + u_pulseAmt * pulse());
  p /= sc;
  p.x /= u_stretchX;
  p.y /= u_stretchY;
  p.y += 0.5; // heart occupies y in [0,1] in SDF space

  float d = heartSDF(p);
  float dc = length(p - vec2(0.0, 0.55)) - 0.55;
  d = mix(d, dc, u_round);

  // map the field onto the editable gradient: spread scales, shift slides,
  // band curve warps, then one texture lookup on the baked 256x1 ramp
  float dn = (d - u_bandOff) / u_spread;
  dn = sign(dn) * pow(abs(dn), 1.0 / u_spaceExp);
  float gu = (dn + 0.55) / 1.25;
  vec3 c = texture2D(u_grad, vec2(clamp(gu, 0.002, 0.998), 0.5)).rgb;

  float glowMask = smoothstep(u_glowU0 - u_soft / 1.25, u_glowU1, gu);
  c += u_colGlow * u_glowStr * glowMask * exp(-max(gu - u_glowU0, 0.0) * 1.25 / max(u_glowFall, 0.01));
  return c;
}

// vertical-strip glitch warp for a specific (integer) strip count; also
// outputs per-strip edge shading. The strip count itself is fixed (see
// A slice is a visible band of content; adjacent slices meet directly (no
// separator bars) and are distinguished only by the discontinuity in what
// they sample. "space" is the width of each slice: near 0 the slices go
// hairline-thin and the warp becomes effectively continuous (reads as no
// slicing at all), mid values give many visible slices, and 100 makes each
// slice half the screen wide (reads as ~2 big slices). The grid is
// anchored on a slice centred at the screen's middle, so it is always
// mirror-symmetric and slices grow outward from the centre as the width
// changes — a continuous motion, since every boundary position moves
// smoothly with the width value.
vec3 sliceLayer(vec2 uv, vec2 suv){
  float shade = 1.0;
  vec2 wuv = uv;
  if (u_sliceMix > 0.001){
    float aspect = u_res.x / u_res.y;
    float w = max(clamp(u_sliceSpaceFrac, 0.0, 1.0), 0.004); // slice width in suv units (screen = 2)
    // per-slice detail (shear, tilt, jitter, shading) fades out as slices
    // approach subpixel width, so tiny widths stay clean instead of noisy
    float gate = smoothstep(0.01, 0.08, w);

    float p = suv.x / w + 0.5;   // grid with one slice centred on x = 0
    float idx = floor(p);
    float local = fract(p);
    float cxs = idx * w;         // slice centre in suv space
    float cx = cxs * aspect;     // slice centre in aspect space
    float sd = cxs;              // signed distance from screen centre
    float rank = abs(idx);       // shared by mirror partners — always symmetric

    float h1 = hash(rank * 7.31 + u_sliceSeed * 1.13 + 3.7);
    float h2 = hash(rank * 3.77 + u_sliceSeed * 2.71 + 11.0);
    float h3 = hash(rank * 9.13 + u_sliceSeed * 0.93 + 27.0);
    float h4 = hash(rank * 5.21 + u_sliceSeed * 1.31 + 41.0);
    float h5 = hash(rank * 6.53 + u_sliceSeed * 0.57 + 53.0);

    float dr = sin(u_driftPhase * 2.0 + rank * 1.71);
    float dc2 = cos(u_driftPhase * 1.6 + rank * 2.39);

    float alt = mod(rank, 2.0) * 2.0 - 1.0;         // alternating fold direction
    float r = clamp(u_sliceRandom, 0.0, 1.0) * gate;

    // random pattern
    float oxR = (h1 - 0.5) * 2.0 * u_sliceOffX;
    float oyR = (h2 - 0.5) * 2.0 * u_sliceOffY;
    float stR = 1.0 + h3 * 2.0 * u_sliceZoom;
    float skR = (h4 - 0.5) * 2.0 * u_sliceSkew;
    float tiR = (h5 - 0.5) * 2.0 * u_slicePersp;

    // centre-out pattern: distortion grows from the middle outward.
    // oxC partially re-centres each slice's sampling, so central slices
    // repeat the notch and the whole heart fans out like the reference.
    float oxC = -sd * aspect * u_sliceOffX * 2.5;
    float oyC = alt * u_sliceOffY * abs(sd);
    float stC = 1.0 + u_sliceZoom * 1.5 * abs(sd);             // outer slices smear wider
    float skC = sd * u_sliceSkew * 1.5;                        // shear flips at centre
    float tiC = alt * u_slicePersp * (0.25 + 0.75 * abs(sd));  // accordion fold

    float ox = mix(oxC, oxR, r) + 0.4 * dr  * u_sliceOffX * u_drift * gate;
    float oy = (mix(oyC, oyR, r) + 0.4 * dc2 * u_sliceOffY * u_drift) * gate;
    float stretch = max(mix(stC, stR, r), 0.1);
    float skew = mix(skC, skR, r) * gate;
    float tilt = mix(tiC, tiR, r) * gate;

    vec2 guv = uv;
    guv.x = cx + (uv.x - cx) / stretch + ox;
    guv.y = uv.y + oy;

    // folded-panel look: shear + fake perspective across each slice
    float lc = local - 0.5;
    guv.y += lc * skew * 0.7;
    guv.y *= 1.0 + lc * tilt * 0.8;
    wuv = mix(uv, guv, u_sliceMix);

    float e = min(local, 1.0 - local) * 2.0;    // 0 at edges, 1 at centre
    float g = mix(10.0, 1.2, clamp(u_shadeWidth, 0.0, 1.0));
    float sh = 1.0 - u_stripShade * gate * pow(1.0 - e, g);
    sh *= 1.0 - 0.55 * clamp(tilt * lc * 2.0, 0.0, 1.0); // side tilted away goes dark
    shade = mix(1.0, sh, u_sliceMix);
  }
  return heartColor(wuv) * shade;
}

vec3 render(vec2 uv, vec2 suv){
  return sliceLayer(uv, suv);
}

void main(){
  vec2 suv = (2.0 * gl_FragCoord.xy - u_res) / u_res;     // -1..1 both axes
  vec2 uv  = (2.0 * gl_FragCoord.xy - u_res) / u_res.y;   // aspect corrected

  vec3 col;
  if (u_chromAb > 0.0001){
    col.r = render(uv * (1.0 - u_chromAb), suv).r;
    col.g = render(uv, suv).g;
    col.b = render(uv * (1.0 + u_chromAb), suv).b;
  } else {
    col = render(uv, suv);
  }

  if (abs(u_huePhase) > 0.0001) col = hueRotate(col, u_huePhase);

  // grade
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(luma), col, u_sat);
  col = (col - 0.5) * u_contrast + 0.5;
  col *= u_bright;

  col *= 1.0 - u_vig * smoothstep(0.45, 1.5, length(suv));
  col += (hash2(gl_FragCoord.xy + fract(u_time) * 137.0) - 0.5) * u_grain;

  gl_FragColor = vec4(col, 1.0);
}
`;

// bake a signed-distance field of the polygon into an RG16-encoded texture,
// domain [-2,2]x[-1.5,2.5], matching SDF_TS and sdfDecode in the shader
function buildSdfTexture(){
  const TS = 192, n = HEART_PTS.length / 2;
  const data = new Uint8Array(TS * TS * 4);
  for (let j = 0; j < TS; j++){
    const py = -1.5 + 4.0 * (j + 0.5) / TS;
    for (let i2 = 0; i2 < TS; i2++){
      const px = -2.0 + 4.0 * (i2 + 0.5) / TS;
      let best = 1e9;
      let inside = false;
      for (let k = 0; k < n; k++){
        const ax = HEART_PTS[k*2],           ay = HEART_PTS[k*2+1];
        const bx = HEART_PTS[((k+1)%n)*2],   by = HEART_PTS[((k+1)%n)*2+1];
        const ex = bx - ax, ey = by - ay;
        const wx = px - ax, wy = py - ay;
        const t = Math.max(0, Math.min(1, (wx*ex + wy*ey) / (ex*ex + ey*ey)));
        const dx = wx - ex*t, dy = wy - ey*t;
        const dist = dx*dx + dy*dy;
        if (dist < best) best = dist;
        if ((ay > py) !== (by > py) && wx < ex * (py - ay) / ey) inside = !inside;
      }
      const d = (inside ? -1 : 1) * Math.sqrt(best);
      const v = Math.max(0, Math.min(65535, Math.round((d + 0.75) / 3.5 * 65535)));
      const o = (j * TS + i2) * 4;
      data[o] = v >> 8; data[o+1] = v & 255; data[o+2] = 0; data[o+3] = 255;
    }
  }
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, TS, TS, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.activeTexture(gl.TEXTURE0);
}
buildSdfTexture();

// bake the heart's polar radius about (0, 0.5) into a 512x1 lookup table
function buildRadialTexture(){
  const RT = 512, n = HEART_PTS.length / 2, ax = 0, ay = 0.5;
  const data = new Uint8Array(RT * 4);
  for (let i2 = 0; i2 < RT; i2++){
    const ang = (i2 + 0.5) / RT * Math.PI * 2 - Math.PI;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    let best = 0;
    for (let k = 0; k < n; k++){
      const x1 = HEART_PTS[k*2],         y1 = HEART_PTS[k*2+1];
      const x2 = HEART_PTS[((k+1)%n)*2], y2 = HEART_PTS[((k+1)%n)*2+1];
      const ex = x2 - x1, ey = y2 - y1;
      const den = dx * ey - dy * ex;
      if (Math.abs(den) < 1e-12) continue;
      const wx = x1 - ax, wy = y1 - ay;
      const t = (wx * ey - wy * ex) / den;
      const s = (wx * dy - wy * dx) / den;
      if (t > 0 && s >= 0 && s <= 1 && t > best) best = t;
    }
    const v = Math.max(0, Math.min(65535, Math.round(best / 1.5 * 65535)));
    data[i2*4] = v >> 8; data[i2*4+1] = v & 255; data[i2*4+2] = 0; data[i2*4+3] = 255;
  }
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RT, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
  gl.activeTexture(gl.TEXTURE0);
}

function rgbToHex(rgb){

function lerpHex(a, b, t){
  const ra = hexToRgb(a), rb = hexToRgb(b);

// "space" (0-100, quick bar) is the width of each slice — the shader turns
// it into the slice grid directly (100 = half-screen-wide slices, ~0 =
// hairline slices that read as no slicing at all).

for (const [title, items] of GROUPS){
  const det = document.createElement('details');
  det.open = true;
  det.innerHTML = `<summary>${title}</summary>`;
  for (const [key, label, min, max, step, def] of items){
    state[key] = def;
    defaults[key] = def;
    const row = document.createElement('div');
    row.className = 'ctl';
    row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${def}"><span class="val"></span>`;
    const input = row.querySelector('input');
    const val = row.querySelector('.val');
    const show = v => { val.textContent = (+v).toFixed(step >= 1 ? 0 : step >= 0.01 ? 2 : 3); };
    show(def);
    input.addEventListener('input', () => { state[key] = +input.value; show(input.value); });
    inputs[key] = { input, show };
    (BASIC_KEYS.has(key) ? quickBar : det).appendChild(row);
  }
  groupsEl.appendChild(det);
}

// ------------------------------------------------------- gradient editor
let gradStops = DEFAULT_STOPS.map(s => ({ ...s }));
let selStop = 1, gradTex = null, bakedSoft = -1;

const gradDet = document.createElement('details');
gradDet.open = true;
gradDet.innerHTML = `<summary>Gradient</summary>
  <div id="gradWrap" style="position:relative; margin:10px 0 22px;">
    <canvas id="gradBar" width="256" height="1"
      style="width:100%; height:26px; border-radius:6px; display:block; cursor:copy;"></canvas>
    <div id="gradHandles" style="position:absolute; left:0; right:0; top:26px; height:16px;"></div>
  </div>
  <div class="ctl">
    <label>stop color</label>
    <input type="color" id="gradColor" value="#2f7dff">
    <span class="val" id="gradPos"></span>
  </div>
  <div class="ctl">
    <label>hex</label>
    <input type="text" class="hex" id="gradHex" value="#2f7dff" maxlength="7" spellcheck="false">
    <span class="val"></span>
  </div>
  <div class="btnrow">
    <button id="gradAdd">Add Stop</button>
    <button id="gradDel">Delete</button>
    <button id="gradReset">Reset</button>
  </div>
  <div class="sub" style="margin-top:6px;">drag points to move · click to select · double-click bar to add</div>`;

function smoothstepJs(a, b, x){
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// render any stop list into a 256-pixel colour ramp
function computeRamp(stops, soft){
  const W = 256, arr = new Uint8ClampedArray(W * 4);
  const rgbs = stops.map(s => hexToRgb(s.c));
  const softU = Math.max(soft / 1.25, 0.004);
  for (let x = 0; x < W; x++){
    const u = (x + 0.5) / W;
    let c = rgbs[0].slice();
    for (let i = 1; i < stops.length; i++){
      const m = smoothstepJs(stops[i].p - softU, stops[i].p + softU, u);
      c = [c[0] + (rgbs[i][0] - c[0]) * m, c[1] + (rgbs[i][1] - c[1]) * m, c[2] + (rgbs[i][2] - c[2]) * m];
    }
    arr[x*4] = c[0]*255; arr[x*4+1] = c[1]*255; arr[x*4+2] = c[2]*255; arr[x*4+3] = 255;
  }
  return arr;
}

// lastRamp always holds the ramp currently on screen, so a state animation
// can crossfade from exactly what is visible, whatever produced it
let lastRamp = null;
let glowOverride = null;

function uploadRamp(arr){
  lastRamp = arr;
  if (!gradTex) gradTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, gradTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(arr.buffer));
  gl.activeTexture(gl.TEXTURE0);
  const bar = document.getElementById('gradBar');
  bar.getContext('2d').putImageData(new ImageData(arr, 256, 1), 0, 0);
}

function bakeGradient(){
  bakedSoft = state.soft;
  uploadRamp(computeRamp(gradStops, state.soft));
}

function sampleGradientHex(u){
  const softU = Math.max(state.soft / 1.25, 0.004);
  const rgbs = gradStops.map(s => hexToRgb(s.c));
  let c = rgbs[0].slice();
  for (let i = 1; i < gradStops.length; i++){
    const m = smoothstepJs(gradStops[i].p - softU, gradStops[i].p + softU, u);
    c = [c[0] + (rgbs[i][0] - c[0]) * m, c[1] + (rgbs[i][1] - c[1]) * m, c[2] + (rgbs[i][2] - c[2]) * m];
  }
  return '#' + c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
}

function styleHandle(h, i){
  const s = gradStops[i];
  h.style.left = `calc(${(s.p * 100).toFixed(2)}% - 7px)`;
  h.style.background = s.c;
  h.style.border = `2px solid ${i === selStop ? '#fff' : 'rgba(255,255,255,0.35)'}`;
}

function syncStopInputs(){
  const sel = gradStops[selStop];
  if (!sel) return;
  document.getElementById('gradColor').value = sel.c;
  document.getElementById('gradPos').textContent = sel.p.toFixed(2);
  const hexInput = document.getElementById('gradHex');
  if (document.activeElement !== hexInput) hexInput.value = sel.c;
}

function updateGradUI(){
  const handles = document.getElementById('gradHandles');
  handles.innerHTML = '';
  gradStops.forEach((s, i) => {
    const h = document.createElement('div');
    h.style.cssText = 'position:absolute; top:0; width:14px; height:14px; border-radius:50%; cursor:ew-resize; box-sizing:border-box; touch-action:none;';
    styleHandle(h, i);
    h.addEventListener('pointerdown', e => {
      e.preventDefault();
      selStop = i;
      Array.prototype.forEach.call(handles.children, (el, j) => styleHandle(el, j));
      syncStopInputs();
      const rect = document.getElementById('gradBar').getBoundingClientRect();
      h.setPointerCapture(e.pointerId);
      const move = ev => {
        const lo = i > 0 ? gradStops[i-1].p + 0.01 : 0;
        const hi = i < gradStops.length - 1 ? gradStops[i+1].p - 0.01 : 1;
        gradStops[i].p = Math.max(lo, Math.min(hi, (ev.clientX - rect.left) / rect.width));
        styleHandle(h, i);
        document.getElementById('gradPos').textContent = gradStops[i].p.toFixed(2);
        bakeGradient();
      };
      const up = () => {
        h.removeEventListener('pointermove', move);
        h.removeEventListener('pointerup', up);
        h.removeEventListener('pointercancel', up);
        syncStopInputs();
      };
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', up);
      h.addEventListener('pointercancel', up);
    });
    handles.appendChild(h);
  });
  syncStopInputs();
}

function addStopAt(u){
  u = Math.max(0, Math.min(1, u));
  const stop = { p: u, c: sampleGradientHex(u) };
  gradStops.push(stop);
  gradStops.sort((a, b) => a.p - b.p);
  selStop = gradStops.indexOf(stop);
  bakeGradient();
  updateGradUI();
}

function resetGradient(){
  gradStops = DEFAULT_STOPS.map(s => ({ ...s }));
  selStop = 1;
  bakeGradient();
  updateGradUI();
}

groupsEl.appendChild(gradDet);
document.getElementById('gradColor').addEventListener('input', e => {
  gradStops[selStop].c = e.target.value;
  bakeGradient();
  updateGradUI();
});
document.getElementById('gradHex').addEventListener('input', e => {
  const m = e.target.value.trim().match(/^#?([0-9a-fA-F]{6})$/);
  if (!m) return;
  gradStops[selStop].c = '#' + m[1].toLowerCase();
  bakeGradient();
  updateGradUI();
});
document.getElementById('gradHex').addEventListener('blur', () => updateGradUI());
document.getElementById('gradBar').addEventListener('dblclick', e => {
  const rect = e.target.getBoundingClientRect();
  addStopAt((e.clientX - rect.left) / rect.width);
});
document.getElementById('gradAdd').onclick = () => {
  let gi = 0, gap = 0;
  for (let i = 1; i < gradStops.length; i++){
    if (gradStops[i].p - gradStops[i-1].p > gap){ gap = gradStops[i].p - gradStops[i-1].p; gi = i; }
  }
  addStopAt(gradStops[gi-1] ? (gradStops[gi-1].p + gradStops[gi].p) / 2 : 0.5);
};
document.getElementById('gradDel').onclick = () => {
  if (gradStops.length <= 2) return;
  gradStops.splice(selStop, 1);
  selStop = Math.max(0, selStop - 1);
  bakeGradient();
  updateGradUI();
};
document.getElementById('gradReset').onclick = resetGradient;

{
  const det = document.createElement('details');
  det.open = true;
  det.innerHTML = '<summary>Colors</summary>';
  for (const [key, label, def] of COLORS){
    state[key] = def;
    defaults[key] = def;
    const row = document.createElement('div');
    row.className = 'ctl';
    row.innerHTML = `<label>${label}</label><input type="color" value="${def}"><span class="val">${def}</span>`;
    const input = row.querySelector('input');
    const val = row.querySelector('.val');
    input.addEventListener('input', () => { state[key] = input.value; val.textContent = input.value; });
    inputs[key] = { input, show: v => { val.textContent = v; } };
    det.appendChild(row);
  }
  groupsEl.appendChild(det);
}

function setParam(key, v){
  state[key] = v;
  const ui = inputs[key];
  if (ui){ ui.input.value = v; ui.show(v); }
}
function applyValues(obj){ for (const k in obj) setParam(k, obj[k]); }

// ------------------------------------------------------- saved states
// Each saved state is a full snapshot (every slider + the gradient) that
// can be animated to later. Synced to the Railway-hosted /api/presets
// endpoint when the app is served by server.js; falls back to
// localStorage when run from file:// or when the server is unreachable.
const PRESETS_KEY = 'auraHeartPresets';
let savedPresets = [];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function loadLocalPresets(){
  try { return JSON.parse(localStorage.getItem(PRESETS_KEY) || '[]'); }
  catch { return []; }
}

async function fetchPresets(){
  try {
    const res = await fetch('/api/presets', { cache: 'no-store' });
    if (!res.ok) throw new Error('bad status');
    return await res.json();
  } catch (e) {
    return loadLocalPresets();
  }
}

async function persistPresets(list){
  try { localStorage.setItem(PRESETS_KEY, JSON.stringify(list)); } catch (e) {}
  try {
    const res = await fetch('/api/presets', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(list),
    });
    if (!res.ok) throw new Error('bad status');
  } catch (e) {
    // offline or running from file:// — localStorage above already covers it
  }
}

const savedListEl = document.getElementById('savedList');
const toggleSavedBtn = document.getElementById('toggleSaved');

// Smoothly tweens every slider and color from the current live state to a
// saved state's snapshot — sliders visibly slide, the gradient crossfades.
// A token counter cancels any in-flight tween the moment a new one starts,
// so clicking a different state mid-animation blends from wherever it was.
let tweenToken = 0;

function animateToState(p, duration = 1400){
  const myToken = ++tweenToken;
  const fromState = { ...state };
  const toStateSrc = p.state || {};
  const numericKeys = [], hexKeys = [];
  for (const k in fromState){
    if (!(k in toStateSrc)) continue;
    if (typeof fromState[k] === 'number' && typeof toStateSrc[k] === 'number') numericKeys.push(k);
    else if (typeof fromState[k] === 'string' && typeof toStateSrc[k] === 'string') hexKeys.push(k);
  }

  // The gradient crossfades in ramp space: capture the 256-pixel ramp that
  // is on screen right now and blend it pixel-wise toward the target's
  // ramp. That is exact for any combination of stop counts (no stop
  // pairing/padding), and if this tween interrupts another one it starts
  // from precisely what is visible. gradStops/the handles stay untouched
  // until the tween lands, then snap to the target's real stops.
  const hasGrad = Array.isArray(p.gradStops) && p.gradStops.length >= 2 && lastRamp;
  let fromRamp, toStops, fromGlow, toGlow;
  if (hasGrad){
    fromRamp = lastRamp.slice();
    toStops = p.gradStops.map(s => ({ ...s }));
    const cur = glowOverride || [gradStops[gradStops.length - 2].p, gradStops[gradStops.length - 1].p];
    fromGlow = [cur[0], cur[1]];
    toGlow = [toStops[toStops.length - 2].p, toStops[toStops.length - 1].p];
  }

  const start = performance.now();
  function frame(now){
    if (myToken !== tweenToken) return; // superseded by a newer tween
    const t = Math.min(1, (now - start) / duration);
    const e = easeInOutCubic(t);

    for (const k of numericKeys) setParam(k, fromState[k] + (toStateSrc[k] - fromState[k]) * e);
    for (const k of hexKeys) setParam(k, lerpHex(fromState[k], toStateSrc[k], e));

    if (hasGrad){
      const toRamp = computeRamp(toStops, state.soft);
      const blended = new Uint8ClampedArray(fromRamp.length);
      for (let i = 0; i < blended.length; i++){
        blended[i] = fromRamp[i] + (toRamp[i] - fromRamp[i]) * e;
      }
      uploadRamp(blended);
      bakedSoft = state.soft; // keep drawScene from re-baking over the blend
      glowOverride = [
        fromGlow[0] + (toGlow[0] - fromGlow[0]) * e,
        fromGlow[1] + (toGlow[1] - fromGlow[1]) * e,
      ];
    }

    if (t < 1){
      requestAnimationFrame(frame);
    } else if (hasGrad){
      gradStops = toStops;
      selStop = Math.min(selStop, gradStops.length - 1);
      glowOverride = null;
      bakeGradient();
      updateGradUI();
    }
  }
  requestAnimationFrame(frame);
}

function renderSavedList(){
  toggleSavedBtn.textContent = `States (${savedPresets.length}) ▾`;
  savedListEl.innerHTML = '';
  if (!savedPresets.length){
    savedListEl.innerHTML = '<div class="empty">No saved states yet</div>';
    return;
  }
  for (const p of savedPresets){
    const row = document.createElement('div');
    row.className = 'savedRow';
    row.innerHTML = `<span class="name" title="Click to animate to this state">${escapeHtml(p.name)}</span>
      <button class="renameBtn" title="Rename">✎</button>
      <button class="delBtn" title="Delete">✕</button>`;
    row.querySelector('.name').addEventListener('click', () => animateToState(p));
    row.querySelector('.renameBtn').addEventListener('click', e => {
      e.stopPropagation();
      const nameEl = row.querySelector('.name');
      const input = document.createElement('input');
      input.className = 'renameInput';
      input.value = p.name;
      row.replaceChild(input, nameEl);
      input.focus();
      input.select();
      const commit = () => {
        const v = input.value.trim();
        if (v) p.name = v;
        renderSavedList();
        persistPresets(savedPresets);
      };
      input.addEventListener('keydown', ev => { if (ev.key === 'Enter') input.blur(); });
      input.addEventListener('blur', commit, { once: true });
    });
    row.querySelector('.delBtn').addEventListener('click', e => {
      e.stopPropagation();
      savedPresets = savedPresets.filter(x => x.id !== p.id);
      renderSavedList();
      persistPresets(savedPresets);
    });
    savedListEl.appendChild(row);
  }
}

document.getElementById('saveSettings').onclick = async () => {
  const preset = {
    id: (crypto.randomUUID ? crypto.randomUUID() : 'p' + Date.now() + Math.random().toString(16).slice(2)),
    name: `State ${savedPresets.length + 1}`,
    state: { ...state },
    gradStops: gradStops.map(s => ({ ...s })),
  };
  savedPresets.push(preset);
  renderSavedList();
  savedListEl.classList.add('open');
  await persistPresets(savedPresets);
};

toggleSavedBtn.onclick = () => savedListEl.classList.toggle('open');

// export/import the saved states as JSON — the export format is exactly
// what android/states.json and the /api/presets endpoint use
const statesIO = document.getElementById('statesIO');
document.getElementById('exportStates').onclick = () => {
  statesIO.classList.add('open');
  statesIO.value = JSON.stringify(savedPresets, null, 2);
  statesIO.focus();
  statesIO.select();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(statesIO.value).catch(() => {});
  }
};
document.getElementById('importStates').onclick = () => {
  if (!statesIO.classList.contains('open') || !statesIO.value.trim()){
    statesIO.classList.add('open');
    statesIO.value = '';
    statesIO.placeholder = 'paste states JSON here, then press Import again';
    statesIO.focus();
    return;
  }
  try {
    const list = JSON.parse(statesIO.value);
    if (!Array.isArray(list)) throw new Error('expected an array');
    savedPresets = list;
    renderSavedList();
    savedListEl.classList.add('open');
    persistPresets(savedPresets);
    statesIO.classList.remove('open');
  } catch (e) {
    statesIO.value = '';
    statesIO.placeholder = 'invalid JSON — paste the exported states array';
  }
};

fetchPresets().then(list => {
  savedPresets = (Array.isArray(list) && list.length)
    ? list
    : BUILTIN_STATES.map(p => JSON.parse(JSON.stringify(p)));
  renderSavedList();
});

let paused = false, t0 = performance.now(), timeAcc = 0;
document.getElementById('pause').onclick = e => {
  if (!paused) timeAcc += (performance.now() - t0) / 1000;
  else t0 = performance.now();
  paused = !paused;
  e.target.textContent = paused ? 'Play' : 'Pause';
};

document.getElementById('savepng').onclick = () => {
  const a = document.createElement('a');
  a.download = 'aura-heart.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};

const moreSettings = document.getElementById('moreSettings');
const toggle = document.getElementById('toggleUI');
toggle.onclick = () => {
  const on = moreSettings.classList.toggle('open');
  toggle.classList.toggle('on', on);
  toggle.title = on ? 'Hide more controls' : 'Show more controls';
};

// The UI is hidden on load so the page runs as a clean fullscreen visual —
// press Q to reveal it, Q again to hide. Ignored while typing in a field so
// the hex and rename inputs still accept the letter q.
const quickPanelEl = document.getElementById('quickPanel');
window.addEventListener('keydown', e => {
  if (e.key !== 'q' && e.key !== 'Q') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const el = document.activeElement;
  if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
  quickPanelEl.classList.toggle('hidden');
});

// ---------------------------------------------------------------- render loop
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener('resize', resize);
resize();

gl.uniform1i(u('u_grad'), 3);
bakeGradient();
updateGradUI();

// ------------------------------------------------- animation phase clocks
// Each time-driven effect owns an accumulated phase advanced by speed * dt.
// Animating a speed slider then changes only how fast the phase advances —
// never the phase itself — so state transitions can't make motion jitter.
let pulsePhase = 0, spinPhase = 0, huePhase = 0, driftPhase = 0;
let lastTick = performance.now();

function wrapAngle(a){ return Math.atan2(Math.sin(a), Math.cos(a)); }

function advancePhases(){
  const now = performance.now();
  const dt = Math.min((now - lastTick) / 1000, 0.1);
  lastTick = now;
  if (paused) return;
  pulsePhase = (pulsePhase + state.pulseSpeed * dt) % 1000;
  driftPhase = (driftPhase + state.drift * dt) % 1000;
  spinPhase += state.spin * dt;
  huePhase += state.hueCycle * 2.0 * dt;
  // when a speed sits at zero, ease its residual phase back to identity so
  // the visual returns to the saved state's true appearance
  if (Math.abs(state.spin) < 0.001) spinPhase -= wrapAngle(spinPhase) * Math.min(3 * dt, 1);
  if (Math.abs(state.hueCycle) < 0.001) huePhase -= wrapAngle(huePhase) * Math.min(3 * dt, 1);
}

// ---------------------------------------------------------------- draw
function drawScene(overrides){
  resize();
  if (state.soft !== bakedSoft) bakeGradient();
  const t = (paused ? timeAcc : timeAcc + (performance.now() - t0) / 1000) % 3600;
  gl.uniform2f(u('u_res'), canvas.width, canvas.height);
  gl.uniform1f(u('u_time'), t);
  gl.uniform1f(u('u_pulsePhase'), pulsePhase);
  gl.uniform1f(u('u_spinPhase'), spinPhase);
  gl.uniform1f(u('u_huePhase'), huePhase);
  gl.uniform1f(u('u_driftPhase'), driftPhase);
  const ga = glowOverride || [gradStops[gradStops.length - 2].p, gradStops[gradStops.length - 1].p];
  gl.uniform1f(u('u_glowU0'), ga[0]);
  gl.uniform1f(u('u_glowU1'), ga[1]);
  for (const k in state){
    const v = (overrides && k in overrides) ? overrides[k] : state[k];
    if (k === 'sliceSpace'){
      gl.uniform1f(u('u_sliceSpaceFrac'), v / 100);
      continue;
    }
    if (typeof v === 'number') gl.uniform1f(u('u_' + k), v);
    else gl.uniform3fv(u('u_' + k), hexToRgb(v));
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function frame(){
  advancePhases();
  drawScene();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
